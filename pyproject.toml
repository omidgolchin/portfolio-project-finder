[project]
name = "portfolio-atlas"
version = "0.1.0"
description = "Verified, job-relevant portfolio project opportunities for aspiring data analysts, served to AI assistants over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "typing-extensions>=4.13",
]

[project.urls]
Repository = "https://github.com/omidgolchin/portfolio-project-finder"

[project.optional-dependencies]
dev = ["pytest>=8"]
probes = ["duckdb>=2.0"]

[project.scripts]
portfolio-atlas = "portfolio_atlas.server:main"
portfolio-atlas-check = "portfolio_atlas.checks:main"

[tool.vercel]
# Vercel resolves this as a file path from the repository root, hence the src. prefix.
entrypoint = "src.portfolio_atlas.asgi:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
